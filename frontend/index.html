<style>
    body {
        font-family: Arial, sans-serif;

</head>

<body>

```
<h1>Market Volatility Prediction</h1>
<p>10-day future market volatility prediction</p>

<button onclick="getPrediction()">Run Prediction</button>

<div class="card">
    <h2>Prediction</h2>
    <div id="prediction" class="value">--</div>
    <p id="prediction-date">Date: --</p>
</div>

<div class="card">
    <h2>System Status</h2>
    <p id="status">Waiting for prediction...</p>
</div>

<script>
    async function getPrediction() {
        const predictionElement = document.getElementById("prediction");
        const dateElement = document.getElementById("prediction-date");
        const statusElement = document.getElementById("status");

        predictionElement.textContent = "Loading...";
        statusElement.textContent = "Running prediction...";

        try {
            const response = await fetch("http://localhost:8000/predict");

            if (!response.ok) {
                throw new Error("API request failed");
            }

            const data = await response.json();

            predictionElement.textContent =
                data.prediction.prediction.toFixed(6);

            dateElement.textContent =
                "Date: " + data.prediction.date;

            statusElement.textContent =
                "Prediction completed successfully.";

        } catch (error) {
            predictionElement.textContent = "--";
            statusElement.textContent =
                "Error connecting to the API.";
            
            console.error(error);
        }
    }
</script>
```

</body>
</html>
