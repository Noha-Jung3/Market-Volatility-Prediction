name: Deploy API to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t market-volatility-api:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag market-volatility-api:${{ github.sha }} \
            875243384735.dkr.ecr.ap-southeast-2.amazonaws.com/market-volatility-api:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            875243384735.dkr.ecr.ap-southeast-2.amazonaws.com/market-volatility-api:${{ github.sha }}

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition market-volatility-api \
            --query taskDefinition \
            > task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: market-volatility-api
          image: 875243384735.dkr.ecr.ap-southeast-2.amazonaws.com/market-volatility-api:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: market-volatility-api-service
          cluster: market-volatility-cluster
          wait-for-service-stability: true