name: Deploy API to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t market-volatility-api .

      - name: Tag Docker image
        run: |
          docker tag market-volatility-api:latest \
            875243384735.dkr.ecr.ap-southeast-2.amazonaws.com/market-volatility-api:latest

      - name: Push Docker image
        run: |
          docker push \
            875243384735.dkr.ecr.ap-southeast-2.amazonaws.com/market-volatility-api:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster market-volatility-cluster \
            --service market-volatility-api-service \
            --force-new-deployment